<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vendor Profile — GigsUp</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #0b1120;
            color: #e5e7eb;
        }

        .profile-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .profile-card {
            background: #111c30;
            border: 1px solid #263449;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .profile-avatar {
            width: 82px;
            height: 82px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #183c34;
            color: #4ade80;
            font-size: 34px;
            font-weight: bold;
        }

        .profile-name {
            font-size: 28px;
            font-weight: 700;
        }

        .rating-summary {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 24px;
        }

        .rating-box {
            padding: 20px;
            background: #0b1120;
            border-radius: 12px;
            border: 1px solid #263449;
        }

        .rating-number {
            display: block;
            margin-top: 8px;
            font-size: 30px;
            font-weight: 700;
            color: #4ade80;
        }

        .review-card {
            background: #0b1120;
            border: 1px solid #263449;
            border-radius: 12px;
            padding: 20px;
            margin-top: 14px;
        }

        .review-stars {
            color: #fbbf24;
            font-size: 19px;
            letter-spacing: 2px;
        }

        .muted-text {
            color: #9ca3af;
        }

        .profile-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .profile-link {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 8px;
            background: #1f2937;
            color: white;
            text-decoration: none;
        }

        .profile-link:hover {
            background: #374151;
        }

        .message-box {
            padding: 14px;
            margin-top: 16px;
            border-radius: 8px;
            background: #172338;
            color: #d1d5db;
        }

        @media (max-width: 600px) {
            .profile-container {
                margin: 15px auto;
                padding: 12px;
            }

            .profile-card {
                padding: 20px;
            }

            .rating-summary {
                grid-template-columns: 1fr;
            }

            .profile-name {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<header class="dash-top">
    <a class="brand" href="index.html">
        <span class="brand-mark">G</span>
        Gigs<span class="accent">Up</span>
    </a>

    <div>
        <span id="userLabel" class="muted">Vendor Profile</span>
        <button
                id="logoutButton"
                class="btn btn-outline btn-small"
                type="button"
        >
            Logout
        </button>
    </div>
</header>

<main class="profile-container">

    <section class="profile-card">
        <div class="profile-header">

            <div class="profile-avatar" id="profileAvatar">V</div>

            <div>
                <p class="muted-text">BUSINESS ACCOUNT</p>
                <h1 class="profile-name" id="vendorName">
                    Loading profile...
                </h1>
                <p class="muted-text" id="vendorEmail"></p>
            </div>

        </div>

        <div class="rating-summary">

            <div class="rating-box">
                <span class="muted-text">Average Rating</span>
                <strong class="rating-number" id="averageRating">
                    —
                </strong>
                <div class="review-stars" id="averageStars">☆☆☆☆☆</div>
            </div>

            <div class="rating-box">
                <span class="muted-text">Total Reviews</span>
                <strong class="rating-number" id="reviewCount">
                    —
                </strong>
                <span class="muted-text">From students</span>
            </div>

        </div>

        <div class="profile-actions">
            <a class="profile-link" href="vendor-dashboard.html">
                ← Back to Dashboard
            </a>
        </div>

        <div id="profileMessage" class="message-box" aria-live="polite">
            Loading your profile and reviews...
        </div>
    </section>

    <section class="profile-card">
        <h2 class="text-2xl font-bold">⭐ Student Reviews</h2>

        <p class="muted-text" style="margin-top: 8px;">
            Feedback received from students after completed shifts.
        </p>

        <div id="reviewsList">
            <div class="message-box">Loading reviews...</div>
        </div>
    </section>

</main>

<script src="js/app.js"></script>

<script>
    (() => {
        const $ = id => document.getElementById(id);

        const user = window.GigsUp?.getUser?.();

        function showMessage(message) {
            $("profileMessage").textContent = message;
        }

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[character]);
        }

        function renderStars(rating) {
            const rounded = Math.round(Number(rating) || 0);
            return "★".repeat(rounded) + "☆".repeat(5 - rounded);
        }

        function getReviewRating(review) {
            return Number(
                review.rating ??
                review.stars ??
                review.score ??
                0
            );
        }

        function getReviewerName(review) {
            return review.reviewerName ??
                review.studentName ??
                review.reviewer?.name ??
                review.student?.name ??
                "Student";
        }

        function getReviewComment(review) {
            return review.comment ??
                review.reviewText ??
                review.feedback ??
                review.message ??
                "";
        }

        async function loadProfile() {
            if (!window.GigsUp) {
                showMessage("Application scripts failed to load.");
                return;
            }

            if (!user || !user.userId || user.role !== "VENDOR") {
                showMessage("Please log in with your vendor account to view this profile.");

                $("vendorName").textContent = "Vendor profile";
                $("reviewsList").innerHTML =
                    '<div class="message-box">Log in as a vendor to view your reviews.</div>';

                return;
            }

            const vendorId = user.userId;

            $("vendorName").textContent =
                user.name || user.businessName || "Vendor";

            $("vendorEmail").textContent = user.email || "";

            $("profileAvatar").textContent =
                (user.name || user.businessName || "V").charAt(0).toUpperCase();

            try {
                const [summaryResult, reviewsResult] = await Promise.allSettled([
                    GigsUp.api(`/api/reviews/users/${vendorId}/summary`),
                    GigsUp.api(`/api/reviews/users/${vendorId}`)
                ]);

                let summary = null;
                let reviews = [];

                if (summaryResult.status === "fulfilled") {
                    summary = summaryResult.value;
                }

                if (reviewsResult.status === "fulfilled") {
                    const result = reviewsResult.value;

                    reviews = Array.isArray(result)
                        ? result
                        : Array.isArray(result?.content)
                            ? result.content
                            : Array.isArray(result?.reviews)
                                ? result.reviews
                                : [];
                }

                const average = Number(
                    summary?.averageRating ??
                    summary?.average ??
                    summary?.rating ??
                    0
                );

                const count = Number(
                    summary?.reviewCount ??
                    summary?.totalReviews ??
                    summary?.count ??
                    reviews.length
                );

                $("averageRating").textContent =
                    count > 0 ? `${average.toFixed(1)} / 5` : "No ratings";

                $("averageStars").textContent =
                    count > 0 ? renderStars(average) : "☆☆☆☆☆";

                $("reviewCount").textContent = count;

                if (summaryResult.status === "rejected" &&
                    reviewsResult.status === "rejected") {
                    showMessage(
                        "Could not load ratings. Check your login session and backend."
                    );
                } else {
                    showMessage("Profile and review information loaded.");
                }

                renderReviews(reviews);

            } catch (error) {
                console.error("Unable to load vendor profile:", error);
                showMessage("Unable to load profile. Please refresh the page.");
            }
        }

        function renderReviews(reviews) {
            const container = $("reviewsList");

            if (!Array.isArray(reviews) || reviews.length === 0) {
                container.innerHTML =
                    '<div class="message-box">No student reviews yet. Reviews will appear here after students rate completed shifts.</div>';
                return;
            }

            container.innerHTML = reviews.map(review => {
                const rating = Math.max(
                    0,
                    Math.min(5, getReviewRating(review))
                );

                const reviewer = escapeHtml(getReviewerName(review));
                const comment = escapeHtml(getReviewComment(review));

                const dateValue =
                    review.createdAt ??
                    review.reviewedAt ??
                    review.createdDate ??
                    null;

                let formattedDate = "";

                if (dateValue) {
                    const parsedDate = new Date(dateValue);

                    if (!Number.isNaN(parsedDate.getTime())) {
                        formattedDate = parsedDate.toLocaleDateString();
                    }
                }

                return `
                <article class="review-card">
                    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;">
                        <strong>${reviewer}</strong>
                        <span class="muted-text">${escapeHtml(formattedDate)}</span>
                    </div>

                    <div class="review-stars" aria-label="${rating} out of 5 stars">
                        ${renderStars(rating)}
                    </div>

                    <p style="margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere;">
                        ${comment || "No written comment provided."}
                    </p>
                </article>
            `;
            }).join("");
        }

        $("logoutButton").addEventListener("click", () => {
            localStorage.removeItem("gigsup_token");
            localStorage.removeItem("gigsup_user");
            window.location.href = "login.html";
        });

        loadProfile();
    })();
</script>

</body>
</html>
